services:
  generator:
    image: daily-greeting:dev
    build:
      context: .
      network: host
    container_name: daily-greeting-generator
    volumes:
      - ./data:/data
      - ./config.yaml:/config/config.yaml
      - greeting-models:/models
    env_file:
      - path: .env
        required: false
    network_mode: host
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  greeting-models:
